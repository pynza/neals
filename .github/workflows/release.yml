# Build Linux packages (amd64 + arm64) and publish a GitHub Release on tag push.
#
#   git tag -a v0.1.0 -m "v0.1.0"
#   git push origin v0.1.0
#
# Assets (not published to apt/crates.io/etc.):
#   *.tar.gz  *.zip  *.deb  install.sh  uninstall.sh  SHA256SUMS
#
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip dpkg
          chmod +x contrib/packaging/package-linux.sh contrib/systemd/*.sh
          CLEAR_DIST=1 ./contrib/packaging/package-linux.sh \
            "${GITHUB_REF_NAME#v}" "${{ matrix.target }}"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download amd64
        uses: actions/download-artifact@v4
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist-amd64

      - name: Download arm64
        uses: actions/download-artifact@v4
        with:
          name: dist-aarch64-unknown-linux-gnu
          path: dist-arm64

      - name: Merge artifacts
        run: |
          mkdir -p dist
          cp dist-amd64/*.tar.gz dist-amd64/*.zip dist-amd64/*.deb dist/
          cp dist-arm64/*.tar.gz dist-arm64/*.zip dist-arm64/*.deb dist/
          # Same scripts on both builds; take amd64 copy.
          cp dist-amd64/install.sh dist-amd64/uninstall.sh dist/
          chmod 755 dist/install.sh dist/uninstall.sh
          (
            cd dist
            sha256sum ./* >SHA256SUMS
          )
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/install.sh
            dist/uninstall.sh
            dist/SHA256SUMS
