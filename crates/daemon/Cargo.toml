[package]
name = "nealsd"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "nealsd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
neals-common = { path = "../common" }
nix = { version = "0.29", default-features = false, features = ["sched", "user"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "process",
    "signal",
    "fs",
    "time",
] }
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "process",
    "signal",
    "fs",
    "time",
    "test-util",
] }
